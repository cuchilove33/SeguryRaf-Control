<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SR.Control</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#10141a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141a; --surface:#1a2029; --surface-2:#212936; --line:#2a3341;
    --text:#eef1f5; --text-dim:#8b95a5; --accent:#2dd4bf; --accent-dim:#1a3a37;
    --ok:#4ade80; --ok-dim:#173225; --warn:#fbbf24; --warn-dim:#332a13;
    --bad:#f87171; --bad-dim:#331717;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 18px 80px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 22px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;}
  .brand .dot{color:var(--accent);}
  .brand-sub{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  #installBtn{display:none;background:var(--accent);color:#062a26;border:none;padding:9px 14px;border-radius:10px;font-weight:600;font-size:12.5px;cursor:pointer;}
  #logoutBtn{background:none;border:1px solid var(--line);color:var(--text-dim);padding:8px 12px;border-radius:10px;font-size:12px;cursor:pointer;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;}
  .sync-dot.off{background:var(--warn);}
  .sync-line{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-bottom:14px;}

  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:10px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:.15s;user-select:none;}
  .tab.active{background:var(--accent);color:#062a26;}

  .lists-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;-webkit-overflow-scrolling:touch;}
  .lists-scroll::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:.15s;}
  .chip.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}

  .search-box{position:relative;margin-bottom:14px;}
  .search-box input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 46px;color:var(--text);font-size:16px;font-family:'Inter',sans-serif;outline:none;transition:.15s;}
  .search-box input:focus{border-color:var(--accent);}
  .search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-dim);}
  .count-line{font-size:12px;color:var(--text-dim);margin-bottom:12px;padding-left:2px;letter-spacing:.03em;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--line);position:relative;}
  .card.ok{border-left-color:var(--ok);} .card.warn{border-left-color:var(--warn);} .card.bad{border-left-color:var(--bad);}
  .card-top{display:flex;align-items:center;gap:14px;}
  .card-main{flex:1;min-width:0;}
  .card-name{font-weight:600;font-size:15.5px;letter-spacing:-0.01em;}
  .card-meta{font-size:12.5px;color:var(--text-dim);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
  .card-meta .dni{font-family:'JetBrains Mono',monospace;letter-spacing:.02em;}
  .card-list{font-size:11px;color:var(--accent);margin-top:4px;font-weight:600;letter-spacing:.02em;}
  .card-vehiculos{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;}
  .vehiculo-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);}
  .vehiculo-row svg{flex-shrink:0;opacity:.6;}
  .vehiculo-row .patente{font-family:'JetBrains Mono',monospace;color:var(--text);background:var(--surface-2);padding:2px 8px;border-radius:6px;letter-spacing:.03em;font-size:11.5px;}
  .badge{font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;}
  .badge.ok{background:var(--ok-dim);color:var(--ok);} .badge.warn{background:var(--warn-dim);color:var(--warn);} .badge.bad{background:var(--bad-dim);color:var(--bad);}
  .card-actions{display:flex;gap:6px;}
  .icon-btn{width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0;}
  .icon-btn:hover{color:var(--text);border-color:var(--accent);}
  .empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty svg{opacity:.35;margin-bottom:14px;} .empty p{font-size:14px;}

  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .form-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin-bottom:16px;}
  .form-section{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line);}
  .form-section:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;}
  .field .opt{text-transform:none;letter-spacing:0;opacity:.65;font-size:11px;}
  .field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;outline:none;}
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .status-picker{display:flex;gap:8px;}
  .status-opt{flex:1;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-dim);transition:.15s;}
  .status-opt.sel.ok{background:var(--ok-dim);color:var(--ok);border-color:var(--ok);}
  .status-opt.sel.warn{background:var(--warn-dim);color:var(--warn);border-color:var(--warn);}
  .status-opt.sel.bad{background:var(--bad-dim);color:var(--bad);border-color:var(--bad);}
  .new-list-row{display:flex;gap:8px;}
  .new-list-row input{flex:1;}
  .new-list-row button{flex-shrink:0;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;}
  .vehiculo-block{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .vehiculo-block-title{font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0;}
  .remove-veh{color:var(--bad);font-size:12px;font-weight:600;cursor:pointer;background:none;border:none;}
  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;}
  .btn-primary{background:var(--accent);color:#062a26;margin-top:6px;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);margin-top:8px;}
  .btn:disabled{opacity:.6;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .modal-overlay{position:fixed;inset:0;background:rgba(8,10,14,.7);display:none;align-items:flex-end;justify-content:center;z-index:40;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:720px;padding:22px 18px 28px;}
  .modal-title{font-size:15px;font-weight:600;margin-bottom:6px;}
  .modal-sub{font-size:13px;color:var(--text-dim);margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn{margin-top:0;}
  .btn-danger{background:var(--bad-dim);color:var(--bad);}
  ::selection{background:var(--accent);color:#062a26;}

  /* Login */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;}
  .login-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;text-align:center;margin-bottom:4px;}
  .login-sub{text-align:center;font-size:12.5px;color:var(--text-dim);margin-bottom:26px;}
  .login-error{background:var(--bad-dim);color:var(--bad);font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:14px;display:none;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-brand">SR<span style="color:var(--accent);">.</span>Control</div>
    <div class="login-sub">Iniciá sesión para ver los datos compartidos</div>
    <div class="login-error" id="loginError"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="nombre@club.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn">Ingresar</button>
  </div>
</div>

<div class="wrap" id="mainApp" style="display:none;">

  <header>
    <div>
      <div class="brand">SR<span class="dot">.</span>Control</div>
      <div class="brand-sub">Control de acceso</div>
    </div>
    <div class="header-actions">
      <button id="installBtn">Instalar app</button>
      <button id="logoutBtn">Salir</button>
    </div>
  </header>

  <div class="sync-line"><div class="sync-dot" id="syncDot"></div><span id="syncText">Conectado</span></div>

  <div class="tabs">
    <div class="tab active" data-tab="buscar">Buscar</div>
    <div class="tab" data-tab="agregar">Agregar</div>
  </div>

  <div id="view-buscar">
    <div class="lists-scroll" id="listsScroll"></div>
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar por nombre, apellido o patente..." autocomplete="off">
    </div>
    <div class="count-line" id="countLine">Cargando...</div>
    <div id="results"></div>
  </div>

  <div id="view-agregar" style="display:none;">
    <div class="form-card">
      <div class="form-title" id="formTitle">Nueva persona</div>
      <div class="form-section">Datos básicos</div>
      <div class="field"><label>Nombre</label><input type="text" id="f-nombre" placeholder="Juan"></div>
      <div class="field"><label>Apellido</label><input type="text" id="f-apellido" placeholder="Pérez"></div>
      <div class="field"><label>Lista</label><select id="f-lista"></select></div>
      <div id="newListRow" class="new-list-row" style="display:none;margin-top:-4px;margin-bottom:14px;">
        <input type="text" id="f-nueva-lista" placeholder="Nombre de la nueva lista, ej: Socios Golf">
        <button type="button" id="crearListaBtn">Crear</button>
      </div>
      <div class="form-section">Datos adicionales <span class="opt">(opcional)</span></div>
      <div class="row2">
        <div class="field"><label>DNI <span class="opt">(opcional)</span></label><input type="text" id="f-dni" placeholder="30123456" inputmode="numeric"></div>
        <div class="field"><label>N° de socio <span class="opt">(opcional)</span></label><input type="text" id="f-numsocio" placeholder="1024"></div>
      </div>
      <div class="field"><label>Fecha de nacimiento <span class="opt">(opcional)</span></label><input type="date" id="f-nacimiento"></div>
      <div class="field"><label>Teléfono <span class="opt">(opcional)</span></label><input type="text" id="f-telefono" placeholder="11 1234-5678"></div>
      <div class="field">
        <label>Estado</label>
        <div class="status-picker">
          <div class="status-opt sel ok" data-status="socio">Socio</div>
          <div class="status-opt warn" data-status="vencido">Vencido</div>
          <div class="status-opt bad" data-status="no-socio">No socio</div>
        </div>
      </div>
      <div class="form-section">Vehículos <span class="opt">(opcional)</span></div>
      <div class="vehiculo-block">
        <div class="vehiculo-block-title">Vehículo 1</div>
        <div class="field"><label>Marca y modelo</label><input type="text" id="f-v1-modelo" placeholder="Toyota Corolla"></div>
        <div class="field" style="margin-bottom:0;"><label>Patente</label><input type="text" id="f-v1-patente" placeholder="AA 111 AB"></div>
      </div>
      <div class="vehiculo-block" id="vehiculo2Block" style="display:none;">
        <div class="vehiculo-block-title">Vehículo 2<button type="button" class="remove-veh" id="quitarVeh2">Quitar</button></div>
        <div class="field"><label>Marca y modelo</label><input type="text" id="f-v2-modelo" placeholder="Ford Fiesta"></div>
        <div class="field" style="margin-bottom:0;"><label>Patente</label><input type="text" id="f-v2-patente" placeholder="AC 222 BB"></div>
      </div>
      <button type="button" class="link-btn" id="agregarVeh2">+ Agregar segundo vehículo</button>
      <button class="btn btn-primary" id="saveBtn" style="margin-top:20px;">Guardar</button>
      <button class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Cancelar edición</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">¿Eliminar a esta persona?</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel" style="margin:0;">Cancelar</button>
      <button class="btn btn-danger" id="modalConfirm" style="margin:0;">Eliminar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDVp6oEJ5SBcQ_NL6cxiYU0GW-mje5Rcsg",
  authDomain: "seguryraf-control.firebaseapp.com",
  projectId: "seguryraf-control",
  storageBucket: "seguryraf-control.firebasestorage.app",
  messagingSenderId: "935198962817",
  appId: "1:935198962817:web:6792ae2ed2c01ba0338980"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
enableIndexedDbPersistence(db).catch(() => {});

let personas = [];
let listas = [];
let unsubPersonas = null;
let unsubListas = null;
let editingId = null;
let deletingId = null;
let currentStatus = 'socio';

const $ = (s) => document.querySelector(s);
const searchInput = $('#searchInput');
const results = $('#results');
const countLine = $('#countLine');
const listsScroll = $('#listsScroll');
const f_lista = $('#f-lista');
let activeList = 'todas';

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// --- LOGIN ---
$('#loginBtn').onclick = async () => {
  const email = $('#login-email').value.trim();
  const pass = $('#login-pass').value;
  const errBox = $('#loginError');
  errBox.style.display = 'none';
  if(!email || !pass){ errBox.textContent = 'Completá email y contraseña'; errBox.style.display='block'; return; }
  $('#loginBtn').disabled = true;
  $('#loginBtn').textContent = 'Ingresando...';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    errBox.textContent = 'Email o contraseña incorrectos';
    errBox.style.display = 'block';
  }
  $('#loginBtn').disabled = false;
  $('#loginBtn').textContent = 'Ingresar';
};

$('#logoutBtn').onclick = async () => {
  await signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  if(user){
    $('#loginScreen').style.display = 'none';
    $('#mainApp').style.display = 'block';
    subscribeData();
  }else{
    $('#loginScreen').style.display = 'flex';
    $('#mainApp').style.display = 'none';
    if(unsubPersonas) unsubPersonas();
    if(unsubListas) unsubListas();
  }
});

window.addEventListener('online', () => { $('#syncDot').classList.remove('off'); $('#syncText').textContent = 'Conectado'; });
window.addEventListener('offline', () => { $('#syncDot').classList.add('off'); $('#syncText').textContent = 'Sin conexión (viendo datos guardados)'; });
if(!navigator.onLine){ $('#syncDot').classList.add('off'); $('#syncText').textContent = 'Sin conexión (viendo datos guardados)'; }

function subscribeData(){
  unsubPersonas = onSnapshot(collection(db, 'personas'), (snap) => {
    personas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderListChips();
    render();
  }, () => toast('No se pudieron cargar los datos'));

  unsubListas = onSnapshot(doc(db, 'meta', 'listas'), (snap) => {
    listas = snap.exists() ? (snap.data().nombres || []) : [];
    renderListSelect();
    renderListChips();
  });
}

function statusInfo(status){
  if(status === 'socio') return {cls:'ok', label:'Socio al día'};
  if(status === 'vencido') return {cls:'warn', label:'Cuota vencida'};
  return {cls:'bad', label:'No es socio'};
}

function calcAge(dateStr){
  if(!dateStr) return null;
  const b = new Date(dateStr); const t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
  return age;
}

function renderListChips(){
  const chips = ['todas', ...listas];
  listsScroll.innerHTML = chips.map(l => {
    const label = l === 'todas' ? 'Todas' : l;
    const active = l === activeList ? 'active' : '';
    return `<div class="chip ${active}" data-list="${escapeHtml(l)}">${escapeHtml(label)}</div>`;
  }).join('');
  listsScroll.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => { activeList = c.dataset.list; renderListChips(); render(); });
  });
}

function renderListSelect(){
  const prevVal = f_lista.value;
  const opts = listas.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
  f_lista.innerHTML = opts + `<option value="__nueva__">+ Crear nueva lista...</option>`;
  if(listas.includes(prevVal)) f_lista.value = prevVal;
  else if(listas.length > 0) f_lista.value = listas[0];
  $('#newListRow').style.display = (f_lista.value === '__nueva__') ? 'flex' : 'none';
}

f_lista.addEventListener('change', () => {
  if(f_lista.value === '__nueva__'){ $('#newListRow').style.display = 'flex'; $('#f-nueva-lista').focus(); }
  else{ $('#newListRow').style.display = 'none'; }
});

$('#crearListaBtn').onclick = async () => {
  const nombre = $('#f-nueva-lista').value.trim();
  if(!nombre){ toast('Escribí un nombre para la lista'); return; }
  try{
    await setDoc(doc(db, 'meta', 'listas'), { nombres: arrayUnion(nombre) }, { merge: true });
    f_lista.value = nombre;
    $('#newListRow').style.display = 'none';
    $('#f-nueva-lista').value = '';
    toast('Lista creada');
  }catch(e){ toast('No se pudo crear la lista'); }
};

function render(){
  const q = searchInput.value.trim().toLowerCase();
  let base = personas.slice();
  if(activeList !== 'todas') base = base.filter(p => p.lista === activeList);
  const filtered = !q ? base.sort((a,b)=>(a.apellido||'').localeCompare(b.apellido||'')) :
    base.filter(p =>
      ((p.nombre||'')+' '+(p.apellido||'')).toLowerCase().includes(q) ||
      (p.apellido||'').toLowerCase().includes(q) ||
      (p.nombre||'').toLowerCase().includes(q) ||
      (p.dni||'').includes(q) ||
      (p.v1patente||'').toLowerCase().replace(/\s/g,'').includes(q.replace(/\s/g,'')) ||
      (p.v2patente||'').toLowerCase().replace(/\s/g,'').includes(q.replace(/\s/g,''))
    );

  const totalEnLista = activeList === 'todas' ? personas.length : personas.filter(p => p.lista === activeList).length;
  countLine.textContent = personas.length === 0
    ? 'Todavía no cargaste a nadie'
    : (q ? `${filtered.length} resultado${filtered.length===1?'':'s'}` : `${totalEnLista} persona${totalEnLista===1?'':'s'} registrada${totalEnLista===1?'':'s'}`);

  if(filtered.length === 0){
    results.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
      <p>${personas.length === 0 ? 'Agregá la primera persona desde la pestaña "Agregar"' : 'No hay nadie con esos datos'}</p>
    </div>`;
    return;
  }

  results.innerHTML = filtered.map(p => {
    const si = statusInfo(p.status);
    const age = calcAge(p.nacimiento);
    const metaParts = [];
    if(p.dni) metaParts.push(`<span class="dni">DNI ${p.dni}</span>`);
    if(p.numsocio) metaParts.push(`Socio N° ${p.numsocio}`);
    if(age !== null) metaParts.push(`${age} años`);
    if(p.telefono) metaParts.push(p.telefono);

    let vehiculosHtml = '';
    const vehiculos = [];
    if(p.v1modelo || p.v1patente) vehiculos.push({modelo:p.v1modelo, patente:p.v1patente});
    if(p.v2modelo || p.v2patente) vehiculos.push({modelo:p.v2modelo, patente:p.v2patente});
    if(vehiculos.length){
      vehiculosHtml = `<div class="card-vehiculos">` + vehiculos.map(v => `
        <div class="vehiculo-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><path d="M3 13h18v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4z"/></svg>
          <span>${escapeHtml(v.modelo || 'Vehículo')}</span>
          ${v.patente ? `<span class="patente">${escapeHtml(v.patente)}</span>` : ''}
        </div>`).join('') + `</div>`;
    }

    return `
    <div class="card ${si.cls}">
      <div class="card-top">
        <div class="card-main">
          <div class="card-name">${escapeHtml(p.nombre)} ${escapeHtml(p.apellido)}</div>
          <div class="card-meta">${metaParts.join(' &middot; ')}</div>
          ${p.lista ? `<div class="card-list">${escapeHtml(p.lista)}</div>` : ''}
        </div>
        <div class="badge ${si.cls}">${si.label}</div>
        <div class="card-actions">
          <div class="icon-btn" onclick="editPerson('${p.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </div>
          <div class="icon-btn" onclick="askDelete('${p.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </div>
        </div>
      </div>
      ${vehiculosHtml}
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function resetForm(){
  editingId = null; currentStatus = 'socio';
  $('#f-nombre').value=''; $('#f-apellido').value=''; $('#f-dni').value=''; $('#f-numsocio').value='';
  $('#f-nacimiento').value=''; $('#f-telefono').value='';
  $('#f-v1-modelo').value=''; $('#f-v1-patente').value=''; $('#f-v2-modelo').value=''; $('#f-v2-patente').value='';
  $('#vehiculo2Block').style.display='none'; $('#agregarVeh2').style.display='block';
  $('#newListRow').style.display='none';
  document.querySelectorAll('.status-opt').forEach(el => el.classList.remove('sel'));
  document.querySelector('.status-opt[data-status="socio"]').classList.add('sel');
  renderListSelect();
  $('#formTitle').textContent='Nueva persona'; $('#saveBtn').textContent='Guardar'; $('#cancelEditBtn').style.display='none';
}

window.editPerson = function(id){
  const p = personas.find(x => x.id === id);
  if(!p) return;
  editingId = id; currentStatus = p.status;
  $('#f-nombre').value=p.nombre; $('#f-apellido').value=p.apellido;
  $('#f-dni').value=p.dni||''; $('#f-numsocio').value=p.numsocio||'';
  $('#f-nacimiento').value=p.nacimiento||''; $('#f-telefono').value=p.telefono||'';
  $('#f-v1-modelo').value=p.v1modelo||''; $('#f-v1-patente').value=p.v1patente||'';
  if(p.v2modelo || p.v2patente){
    $('#vehiculo2Block').style.display='block'; $('#agregarVeh2').style.display='none';
    $('#f-v2-modelo').value=p.v2modelo||''; $('#f-v2-patente').value=p.v2patente||'';
  }else{
    $('#vehiculo2Block').style.display='none'; $('#agregarVeh2').style.display='block';
  }
  renderListSelect();
  if(p.lista) f_lista.value = p.lista;
  document.querySelectorAll('.status-opt').forEach(el => el.classList.remove('sel'));
  document.querySelector(`.status-opt[data-status="${p.status}"]`).classList.add('sel');
  $('#formTitle').textContent='Editar persona'; $('#saveBtn').textContent='Guardar cambios'; $('#cancelEditBtn').style.display='block';
  switchTab('agregar');
}

window.askDelete = function(id){
  const p = personas.find(x => x.id === id);
  if(!p) return;
  deletingId = id;
  $('#modalSub').textContent = `${p.nombre} ${p.apellido} se va a borrar de SR.Control.`;
  $('#modalOverlay').classList.add('show');
}

$('#modalCancel').onclick = () => { $('#modalOverlay').classList.remove('show'); deletingId = null; };
$('#modalConfirm').onclick = async () => {
  try{
    await deleteDoc(doc(db, 'personas', deletingId));
    toast('Persona eliminada');
  }catch(e){ toast('No se pudo eliminar'); }
  $('#modalOverlay').classList.remove('show');
  deletingId = null;
};

document.querySelectorAll('.status-opt').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.status-opt').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel'); currentStatus = el.dataset.status;
  });
});

$('#agregarVeh2').onclick = () => { $('#vehiculo2Block').style.display='block'; $('#agregarVeh2').style.display='none'; };
$('#quitarVeh2').onclick = () => {
  $('#f-v2-modelo').value=''; $('#f-v2-patente').value='';
  $('#vehiculo2Block').style.display='none'; $('#agregarVeh2').style.display='block';
};

$('#saveBtn').onclick = async () => {
  const nombre = $('#f-nombre').value.trim();
  const apellido = $('#f-apellido').value.trim();
  if(!nombre || !apellido){ toast('Ingresá nombre y apellido'); return; }
  let lista = f_lista.value;
  if(lista === '__nueva__' || !lista) lista = '';

  const data = {
    nombre, apellido, lista,
    dni: $('#f-dni').value.trim(),
    numsocio: $('#f-numsocio').value.trim(),
    nacimiento: $('#f-nacimiento').value,
    telefono: $('#f-telefono').value.trim(),
    status: currentStatus,
    v1modelo: $('#f-v1-modelo').value.trim(),
    v1patente: $('#f-v1-patente').value.trim(),
    v2modelo: $('#f-v2-modelo').value.trim(),
    v2patente: $('#f-v2-patente').value.trim()
  };

  $('#saveBtn').disabled = true;
  try{
    if(editingId){
      await updateDoc(doc(db, 'personas', editingId), data);
      toast('Cambios guardados');
    }else{
      await addDoc(collection(db, 'personas'), data);
      toast('Persona agregada');
    }
    resetForm();
    switchTab('buscar');
  }catch(e){
    toast('No se pudo guardar (revisá la conexión)');
  }
  $('#saveBtn').disabled = false;
};

$('#cancelEditBtn').onclick = () => { resetForm(); switchTab('buscar'); };

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $('#view-buscar').style.display = name === 'buscar' ? 'block' : 'none';
  $('#view-agregar').style.display = name === 'agregar' ? 'block' : 'none';
  if(name === 'buscar') searchInput.focus();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    if(t.dataset.tab === 'agregar' && editingId === null) resetForm();
    switchTab(t.dataset.tab);
  });
});

searchInput.addEventListener('input', render);

// --- Instalación como app ---
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null; installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js'); });
}
</script>
</body>
</html>
